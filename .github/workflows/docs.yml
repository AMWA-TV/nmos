name: Docs

# Renders the NMOS specification index using Zensical
# (https://zensical.org / https://pypi.org/project/zensical/).
#
# This is an alternative to the legacy nmos-render pipeline in `render.yml`.
# It builds a Material-style site whose index is generated from
# `spec_list.yml` and `themes.yml`, so the resulting page can be grouped,
# sorted and filtered by spec type (IS / MS / BCP / INFO / …) and by theme.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "publish-*"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build with Zensical
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .docs/requirements.txt

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .docs/requirements.txt

      - name: Generate specification index
        env:
          # Published metadata for all specs, including status, releases and
          # default branches. Overridable for forks or staging environments.
          NMOS_SPEC_SOURCE: "https://specs.amwa.tv/nmos/specs.json"
        run: |
          python .docs/build_index.py

      - name: Build site
        run: |
          zensical build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: site/
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: site

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Publish to specs.amwa.tv
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          # Matches the layout used by the existing nmos-render deployment:
          # everything for this repo lives under `/nmos` on the server.
          # Staging path so the new Zensical-rendered site doesn't overwrite
          # the existing nmos-render output at /var/www/specs.amwa.tv/nmos.
          REMOTE_PATH: "/var/www/specs.amwa.tv/new/nmos"
        run: |
          rsync -az --delete \
            -e 'ssh -o StrictHostKeyChecking=yes' \
            site/ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"
